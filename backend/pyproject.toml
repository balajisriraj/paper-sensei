[project]
name = "papersensei"
version = "0.1.0"
description = "Turn any research paper into a guided lesson with diagrams, a quiz and a tutor that cites the page."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.0",
  "fastapi>=0.115",
  "httpx>=0.27",
  "langgraph>=0.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pypdf>=5.0",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
  "sse-starlette>=2.1",
  "uvicorn[standard]>=0.30",
]

[project.scripts]
papersensei = "papersensei.cli:main"

[dependency-groups]
dev = ["fpdf2>=2.7", "pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["papersensei"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares parameters with these calls as defaults.
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]
